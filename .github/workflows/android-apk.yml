name: android-apk

# Builds an installable Android debug APK without EAS, so self-hosters can hand out a
# client that already points at their own deployment. Run manually or on push.
# The ubuntu runner image ships the Android SDK, so no setup-android action is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (android)
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: pnpm --filter @rakazo/mobile exec expo prebuild --platform android --no-install

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rakazo-selfhosted-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
